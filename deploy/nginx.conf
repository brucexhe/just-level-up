# /etc/nginx/conf.d/game.peos.cn.conf
# 前端静态文件放 /var/www/level-up（pnpm build 产物的 dist/ 内容）
# 后端 Docker 只监听 127.0.0.1:2567

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream level_up_server {
    server 127.0.0.1:2567;
    keepalive 16;
}

server {
    listen 80;
    server_name game.peos.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;              # nginx < 1.25 改成 listen 443 ssl http2;
    server_name game.peos.cn;

    ssl_certificate     /etc/letsencrypt/live/game.peos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.peos.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/level-up;
    index index.html;

    # Colyseus 的 matchmake 固定挂在 /matchmake 下，这是唯一需要去掉 /api 前缀的接口
    location /api/matchmake/ {
        proxy_pass http://level_up_server/matchmake/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # 账号接口 /api/register /api/login /api/me
    # 以及房间 WebSocket /api/{processId}/{roomId}
    location /api/ {
        proxy_pass http://level_up_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 带 hash 的资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
