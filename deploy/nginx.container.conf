# 容器内使用：挂载到 /etc/nginx/conf.d/default.conf
# 只监听 80，TLS 由群晖「登录门户 → 反向代理」终止

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream level_up_server {
    server server:2567;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Colyseus 的 matchmake 固定挂在 /matchmake 下，唯一需要去掉 /api 前缀的接口
    location /api/matchmake/ {
        proxy_pass http://level_up_server/matchmake/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # 账号接口 /api/register /api/login /api/me
    # 以及房间 WebSocket /api/{processId}/{roomId}
    location /api/ {
        proxy_pass http://level_up_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
