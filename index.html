<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无限升级 Level Up</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: radial-gradient(1200px 700px at 50% 30%, #18222e 0%, #0b0f14 60%, #070a0d 100%);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        color: #c8d0e0;
        display: flex;
        align-items: center; justify-content: center;
        overflow: hidden;
      }
      #shell {
        position: relative;
        overflow: hidden;
        line-height: 0;
      }
      #app {
        /* 铺满窗口：画布跟着窗口变形，相机在 scene.fitCamera() 里按比例缩放，
           所以任何窗口比例都不会出现黑边（HUD 尺寸与盒子解耦，只缩不放） */
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="app"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/client/game/main.ts"></script>
  </body>
</html>
