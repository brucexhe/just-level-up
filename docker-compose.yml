services:
  server:
    build: .
    image: level-up-server
    container_name: level-up-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 2567
    ports:
      # 本机调试用；公网入口只走下面的 web
      - "127.0.0.1:2567:2567"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2567/__healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: nginx:stable-alpine
    container_name: level-up-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 群晖反向代理指向 http://localhost:8080；端口被占用时改左边
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro

